name: yAI × moltH full integration

on:
  push:
    branches:
      - integration/yai-molth-full
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mount unified yAI platform backend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path("server.ts")
          text = server.read_text(encoding="utf-8")
          import_line = 'import { registerYaiPlatformRoutes } from "./src/server/yaiPlatform";\n'
          if import_line not in text:
              marker = 'import { ModelProviderId, Post } from "./src/types";\n'
              if marker not in text:
                  raise SystemExit("server.ts import anchor not found")
              text = text.replace(marker, marker + import_line, 1)

          call = "  registerYaiPlatformRoutes(app);\n"
          anchor = '  app.use(express.json({ limit: "10mb" }));\n'
          if call not in text:
              if anchor not in text:
                  raise SystemExit("server.ts middleware anchor not found")
              text = text.replace(anchor, anchor + call, 1)

          server.write_text(text, encoding="utf-8")
          PY

      - name: Commit integration mount
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No integration patch required"
            exit 0
          fi
          git add server.ts
          git commit -m "feat(yai): mount unified platform backend"
          git push origin HEAD:integration/yai-molth-full

  validate:
    needs: integrate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/yai-molth-full
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
