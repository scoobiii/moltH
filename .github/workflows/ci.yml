> fase: `S0 — Fechar baseline de CI` · data: `2026-09-06` · hora: `13:30:00 -03:00`
> antes: CI tentava `npm install` sem `package-lock.json` e falhava durante resolução de dependências (`Cannot read properties of null (reading 'edgesOut')`), antes dos testes.
> depois: CI usa o lockfile `bun.lock` já versionado e instala de forma determinística com Bun antes de executar os gates existentes.
