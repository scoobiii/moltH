name: GOS3 Verifiable CI & Truth Matrix

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  audit-and-verify:
    name: "Zero-Trust Verification (LLM só respeita compiladores)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies (locked)
        run: bun install --frozen-lockfile

      - name: TypeScript Lint / Compilation Check
        run: bun run lint

      - name: Production Build Test (Vite + esbuild)
        run: bun run build

      - name: Vitest Comprehensive Audit Suite
        run: bun x vitest run

      - name: GOS3 Unified Full Coverage & 25 Deterministic Tools
        run: bun x tsx tests/gos3_full_coverage.test.ts

      - name: GOS3 Contract Gate & ADR-003 Runtime ID
        run: bun x vitest run src/server/vortexContract.sprint0.test.ts

      - name: Micro-Benchmarks & Hard Stress Test (5,000 ops)
        run: bun run node tests/bench_hard.mjs

      - name: Fault Tolerance & Degrade Stress Test (3,000 ops)
        run: bun run node tests/stress_degrade.mjs

      - name: Compute Truth Matrix & Verifiable Progress %
        run: bun x tsx tests/audit/verify_readme_truth.ts
