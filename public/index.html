<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="moltH GOS3 executable reality dashboard">
<title>moltH · GOS3 Reality</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6edf3;background:#0d1117;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#172033 0,#0d1117 42%);min-height:100vh}
main{max-width:1180px;margin:auto;padding:32px 20px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.brand{font-weight:800;font-size:24px}.sub{color:#8b949e;margin-top:5px}.live{border:1px solid #30363d;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fb950;margin-right:7px}
.hero{border:1px solid #30363d;background:#161b22;border-radius:20px;padding:28px;display:grid;grid-template-columns:1.2fr 2fr;gap:28px;box-shadow:0 18px 60px #0005}.eyebrow{color:#8b949e;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700}.state{font-size:54px;line-height:1;font-weight:900;margin:12px 0}.score{font-size:20px;color:#8b949e}.progress{height:12px;background:#21262d;border-radius:999px;overflow:hidden;margin-top:18px}.bar{height:100%;width:0;background:#3fb950;transition:width .4s}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #30363d;background:#0d1117;border-radius:14px;padding:16px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8b949e}.value{margin-top:6px;font-weight:700;word-break:break-all}.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}.check{border:1px solid #30363d;border-radius:14px;padding:17px;background:#161b22}.status{font-weight:800;margin-top:8px}.PASS{color:#3fb950}.FAIL{color:#f85149}.UNPROVEN,.PARTIAL{color:#d29922}.footer{margin-top:20px;color:#8b949e;font-size:13px}.raw{margin-top:24px}.raw summary{cursor:pointer;color:#8b949e}.raw pre{white-space:pre-wrap;overflow:auto;background:#010409;border:1px solid #21262d;border-radius:12px;padding:15px;font-size:12px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.state{font-size:42px}.top{align-items:flex-start}.meta{grid-template-columns:1fr}}
a{color:inherit}
</style>
</head>
<body>
<main>
<header class="top"><div><div class="brand">moltH / GOS3</div><div class="sub">Executable reality · CI-backed · no LLM scoring</div></div><div class="live"><span class="dot"></span><span id="live">LIVE</span></div></header>
<section class="hero">
<div><div class="eyebrow">Reality Gate</div><div id="state" class="state">UNPROVEN</div><div id="score" class="score">Waiting for executable CI evidence</div><div class="progress"><div id="bar" class="bar"></div></div></div>
<div class="meta"><div class="card"><div class="label">Commit</div><div id="commit" class="value">—</div></div><div class="card"><div class="label">CI run</div><div id="run" class="value">—</div></div><div class="card"><div class="label">Ref</div><div id="ref" class="value">—</div></div><div class="card"><div class="label">Generated</div><div id="generated" class="value">—</div></div></div>
</section>
<section id="checks" class="checks"></section>
<div class="footer">Source: <code>reality-score.json</code> · browser refresh every 5s · cache disabled · CI is authoritative.</div>
<details class="raw"><summary>Raw machine evidence</summary><pre id="raw">Loading…</pre></details>
</main>
<script>
const candidates=['./reality/reality-score.json','./docs/reality/reality-score.json'];
const text=(v)=>v==null?'—':String(v);
async function load(){
  let data=null,lastError=null;
  for(const source of candidates){try{const r=await fetch(source+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+r.statusText);data=await r.json();break}catch(e){lastError=e}}
  if(!data){document.getElementById('state').textContent='UNAVAILABLE';document.getElementById('score').textContent=text(lastError?.message);document.getElementById('live').textContent='OFFLINE';return}
  const max=Number(data.max_score)||100, score=data.score==null?null:Number(data.score);
  document.getElementById('state').textContent=text(data.status||'UNPROVEN');
  document.getElementById('score').textContent=score==null?'UNPROVEN':`${score}/${max} executable score`;
  document.getElementById('bar').style.width=score==null?'0%':`${Math.max(0,Math.min(100,score/max*100))}%`;
  document.getElementById('commit').textContent=text(data.commit_sha);
  document.getElementById('run').textContent=text(data.workflow_run_id);
  document.getElementById('ref').textContent=text(data.ref);
  document.getElementById('generated').textContent=text(data.generated_at);
  document.getElementById('checks').innerHTML=(data.checks||[]).map(c=>`<article class="check"><div>${text(c.label)}</div><div class="status ${text(c.status)}">${text(c.status)}</div><div class="label">weight ${text(c.weight)} · ${text(c.duration_ms)} ms · exit ${text(c.exit_code)}</div></article>`).join('');
  document.getElementById('raw').textContent=JSON.stringify(data,null,2);
  document.getElementById('live').textContent='LIVE';
}
load();setInterval(load,5000);
</script>
</body>
</html>
